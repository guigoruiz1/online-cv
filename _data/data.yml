career-profile:
    title: Career Profile
    summary: |
      I am a particle physicist with a PhD from the University of Manchester, researching solar neutrino detection with liquid Argon time projection chambers. I hold an MSc from University College London and a BSc from the University of São Paulo, with additional experience in software development, data analysis, and operational strategy at Amazon. I also hold private aeroplane pilot licenses from Brazil and the UK.

experiences:
    title: Experiences
    info:
      - role: Network Control Manager
        time: 2020 - 2021
        company: Amazon Logistics, London
        details: |
          Started off as an intern and had a position specially created for me to be hired full time.
            - Automation of reports and data processing through Python scripts, SQL and Excel
            - Managing multiple stakeholders and customers, presenting data and promptly handling last minute requests
            - Prioritisation of workload between long term strategic projects and short term tactical projects

      - role: Hackathon Contestant
        time: 2019
        company: University College London Data Science Society Hackathon
        details: |
          Data science competition in partnership with American Express and Microsoft. 
            - Hosted at Microsoft Reactor London  

      # - role: Undergraduate Research Assistant
      #   time: 2017
      #   company: University of São Paulo
      #   details: |
      #     Programatically (Python) collected, organised and thoroughly analysed a large volume of data from numerous sources to determine the mechanism behind η Carinae’s brightening in the last century.
      #       - Data analysis and interpretation of photometric data
      #       - Development of a Python code to analyse the data

      - role: Undergraduate Researcher Assistant
        time: 2014 - 2016
        company: University of São Paulo
        details: |
          Assisted the construction and tests of GEM type detectors related to the upgrade of the ALICE experiment at the LHC.
            - Funded by CNPq - PIBIC scholarship
            - Presented at the 23rd (2015) and 24th (2016) International Symposium on Scientific Initiation of the University of São Paulo (SIICUSP)
            
      - role: Volunteer
        time: 2014 - 2016
        company: Institute of Physics' LGBT+ Collective
        details: | 
          A founding member in 2014. As one of four direction officers from 2015 to 2016:
            - Planned and coordinated the creation of the collective's manifesto
            - Managed social media and events
            - Persuaded the institute's administration into implementing new policies for guaranteeing the wellbeing of transgender students
            - Held many joint meetings with the student's union officers

education:
    title: Education
    info:
      - degree: PhD in Particle Physics
        university: University of Manchester
        time: 2021 - 2025
        details: |
          Thesis: “Solar Neutrino Detection with a Pixelated Liquid-Argon Time Projection Chamber”. 
          Supervisors: Stefan Söldner-Remdold and Roxanne Guenette.
            - Thesis available on request

      - degree: STFC Summer School
        university: University of Oxford
        time: 2022
        details: |
          One week course on particle physics.

      - degree: MSc in Physics
        university: University College London
        time: 2018 - 2020
        details: |
           Thesis: “Exotic Contributions to Double Beta Decay”. Supervisor: Frank Deppisch.
            - Final result: Distinction (75.5%)
            - Thesis available on request

      - degree: BSc in Physics with Astronomy
        university: University of São Paulo
        time: 2013 - 2018
        details: |
          Consisted of every module from the physics course plus the core modules from the astronomy course. 
          Thesis: "The Light Curve of η Carinae: Intrinsic brightening or dust destruction?"
          Supervisor: Augusto Damineli.
            - Final grade: 7 out of 10
            - Transcript available on request

      - degree: First joint ICTP-Trieste/ICTP-SAIFR School on Particle Physics
        university: IFT-UNESP
        time: 2018
        details: |
          Two week course given by six lecturers each from a different world-class university.

      - degree: Particle Physics Summer Course
        university: University of São Paulo
        time: 2017
        details: |
          One week introductory course to particle physics.
    
