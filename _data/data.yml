projects:
    title: Projects
    intro: >
      Personal projects and academic assignments.
    assignments:
      - title: SoLAr V2 reco
        link: "https://github.com/SoLAr-Neutrinos/SoLAr-V2-reco"
        tagline: Reconstruction and data analysis software for the SoLAr experiment's second prototype detector.

      - title: Yugiquery
        link: "http://guigoruiz1.github.io/yugiquery"
        tagline: Python script to query and display Yu-Gi-Oh! data from the <a href="http://yugipedia.com" target="_blank">yugipedia</a> database.

      - title: Arduino Odometry
        link: "http://github.com/guigoruiz1/arduino-odometry"
        tagline: Jupyter notebook to reconstruct inertial navigation data from arduino sensors.

      - title: nbtools
        link: "https://github.com/guigoruiz1/nbtools"
        tagline: Collection of Jupyter notebook utilities to improve productivity and usability.

      - title: DHT Weather Library
        link: "https://github.com/guigoruiz1/DHT-weather-library"
        tagline: Arduino library for reading the DHT family of sensors and performing common weather calculations.
    
