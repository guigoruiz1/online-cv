    info:
      - degree: PhD in Particle Physics
        university: University of Manchester
        time: 2021 - 2025
        details: |
          Thesis: “Solar Neutrino Detection with a Pixelated Liquid-Argon Time Projection Chamber”. 
          Supervisors: Stefan Söldner-Remdold and Roxanne Guenette.
            - Thesis available <a href="https://inspirehep.net/literature/3113668" target="_blank" rel="noopener noreferrer">here</a>.

      - degree: STFC Summer School
        university: University of Oxford
        time: 2022
        details: |
          One week course on particle physics.

      - degree: MSc in Physics
        university: University College London
        time: 2018 - 2020
        details: |
           Thesis: “Exotic Contributions to Double Beta Decay”. Supervisor: Frank Deppisch.
            - Final result: Distinction (75.5%).
            - Thesis available <a href="https://ruizbad.com/files/MSc_Thesis.pdf" target="_blank" rel="noopener noreferrer">here</a>.

      - degree: BSc in Physics with Astronomy
        university: University of São Paulo
        time: 2013 - 2018
        details: |
          Consisted of every module from the physics course plus the core modules from the astronomy course. 
          Thesis: "The Light Curve of η Carinae: Intrinsic brightening or dust destruction?"
          Supervisor: Augusto Damineli.
            - Final grade: 7 out of 10.
            - Transcript and thesis available on request.

      - degree: First joint ICTP-Trieste/ICTP-SAIFR School on Particle Physics
