name: Sync CV.pdf from latest release

on:
  repository_dispatch:
    types: [sync_cv]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout website repository
        uses: actions/checkout@v4

      - name: Download latest CV.pdf from private repo
        uses: robinraju/release-downloader@v1
        with:
          repository: 'guigoruiz1/cv'
          latest: true
          fileName: 'cv.pdf'
          out-file-path: 'assets/docs/CV.pdf'
          token: ${{ secrets.ACCESS_TOKEN }}   # same token as dispatch

      - name: Verify CV.pdf exists
        run: |
          if [ ! -f assets/docs/CV.pdf ]; then
            echo "Error: CV.pdf not found in latest release!"
            exit 1
          fi

      - name: Commit updated CV.pdf if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update CV.pdf from latest release"
          file_pattern: 'assets/docs/CV.pdf'