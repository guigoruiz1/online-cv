name: Repository Dispatch
on:
  repository_dispatch:
    types: [sync_cv]

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout website repository
        uses: actions/checkout@v4

      - name: Download latest cv.pdf from private repo
        uses: robinraju/release-downloader@v1
        with:
          repository: 'guigoruiz1/cv'
          latest: true
          fileName: 'cv.pdf'
          out-file-path: 'assets/docs'
          token: ${{ secrets.PAT }}

      - name: Verify cv.pdf exists
        run: |
          if [ ! -f assets/docs/cv.pdf ]; then
            echo "Error: cv.pdf not found in latest release!"
            exit 1
          fi

      - name: Commit updated cv.pdf if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update cv.pdf from latest release"
          file_pattern: 'assets/docs/cv.pdf'
