{% assign events = site.data.data.events %}
{% if events %}
<section class="section events-section">
  <h2 class="section-title">
    <span class="fa-stack fa-xs">
      <i class="fas fa-circle fa-stack-2x"></i>
      <i class="fas fa-calendar fa-stack-1x fa-inverse"></i>
    </span>
    {{ events.title }}
  </h2>

  {% for events in events.info %}
  <div class="item">

    <div class="meta">

      <div class="upper-row">
        <h3 class="job-title">{{ events.role }}</h3>
        <div class="time">{{ events.time }}</div>
      </div><!--//upper-row-->

      <div class="location">{{ events.location }}</div>

    </div><!--//meta-->

    {% if events.details %}
    <div class="details">
      {{ events.details | markdownify }}
    </div><!--//details-->
    {% endif %}

  </div><!--//item-->
  {% endfor %}

</section><!--//section-->
{% endif %}
